services:
  openplc-runtime:
    image: ghcr.io/autonomy-logic/openplc-runtime:latest
    container_name: water-treatment-openplc

    cap_add:
      - SYS_NICE
      - SYS_RESOURCE

    ports:
      - "127.0.0.1:8443:8443"
      - "127.0.0.1:5020:5020"

    volumes:
      - openplc-runtime-data:/var/run/runtime

    environment:
      - TZ=America/Vancouver

    restart: unless-stopped

volumes:
  openplc-runtime-data: